<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#101c21" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/Sprites/Characters/Default/character_green_idle.png" />
    <title>Rimba Relay — oleh Alfa Tabi Mawarid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="controller-page">
    <section id="join" class="panel join-panel">
      <span class="eyebrow">RIMBA / RELAY</span>
      <h1>Siap melompat?</h1>
      <p>Masuk ke room di layar utama.</p>
      <form id="join-form">
        <label for="room">Kode room</label
        ><input
          id="room"
          maxlength="4"
          pattern="[A-Za-z]{4}"
          placeholder="ABCD"
          required
          autocomplete="off"
          autocapitalize="characters"
        /><label for="name">Namamu</label
        ><input
          id="name"
          maxlength="16"
          required
          placeholder="Nama petualang"
          autocomplete="nickname"
        /><button id="join-button" class="wide">Gabung permainan →</button>
      </form>
      <p id="error" class="error" role="alert"></p>
      <p class="creator small">Dibuat oleh Alfa Tabi Mawarid</p>
    </section>
    <section id="pad" hidden>
      <button id="swap-sides" type="button" aria-label="Tukar sisi kontrol" aria-pressed="false">⇄</button>
      <div class="controller-bar">
        <span
          ><img id="avatar" class="controller-avatar" alt="Karakter" /><b
            id="player-name"
          ></b></span
        ><span id="controller-status" class="controller-message"
          >Menunggu host…</span
        ><span id="room-label" class="tag"></span>
      </div>
      <div id="remote-roster"></div>
      <div class="controls">
        <div class="direction-shell"><div id="direction-pad" role="group" aria-label="Pad arah kiri dan kanan" tabindex="0"><div class="direction-visual"><span data-side="left">←</span><span data-side="right">→</span></div></div></div>
        <button id="jump-pad" class="jump-hit" data-action="jump" aria-label="A, lompat"><span class="jump-face">A</span></button>
      </div>
      <div class="remote-menu"><p id="remote-wait"></p><div id="remote-actions"></div></div>
    </section>
    <p id="install-hint" class="install-hint" hidden>Tambahkan ke Layar Utama untuk layar penuh</p>
    <div class="rotate">
      ↻<br />Putar HP ke landscape<br />untuk mulai bermain.
    </div>
    <script type="module" src="controller.js"></script>
  </body>
</html>
